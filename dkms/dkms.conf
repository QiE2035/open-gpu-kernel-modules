PACKAGE_NAME="nvidia-va"
PACKAGE_VERSION="620.73.04"

# Build from the top of the source tree: that builds nv-kernel.o /
# nv-modeset-kernel.o first and then descends into kernel-open/.
MAKE[0]="'make' -j$(nproc) LLVM=1 LD=ld.lld IGNORE_CC_MISMATCH=1 KERNEL_UNAME=${kernelver} modules"
CLEAN="'make' LLVM=1 LD=ld.lld clean"

BUILT_MODULE_NAME[0]="nvidia"
BUILT_MODULE_NAME[1]="nvidia-modeset"
BUILT_MODULE_NAME[2]="nvidia-drm"
BUILT_MODULE_NAME[3]="nvidia-uvm"

BUILT_MODULE_LOCATION[0]="kernel-open"
BUILT_MODULE_LOCATION[1]="kernel-open"
BUILT_MODULE_LOCATION[2]="kernel-open"
BUILT_MODULE_LOCATION[3]="kernel-open"

# /lib/modules/<kver>/updates is searched before extramodules (see
# /usr/lib/depmod.d/search.conf), so this module wins over the distribution
# nvidia-open package's extramodules/nvidia.ko.zst after depmod runs.
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
DEST_MODULE_LOCATION[3]="/updates/dkms"

AUTOINSTALL="yes"
